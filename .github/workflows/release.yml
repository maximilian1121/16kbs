name: Build & Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    build-linux:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install deps
              run: |
                  pip install nuitka PySide6

            - name: Build Linux binary
              run: |
                  chmod +x build.sh
                  VERSION=${GITHUB_REF_NAME} ./build.sh

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: linux-build
                  path: dist/*

    build-windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install deps
              run: |
                  pip install nuitka PySide6

            - name: Build Windows binary
              shell: bash
              run: |
                  VERSION=${GITHUB_REF_NAME} ./build.sh

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows-build
                  path: dist/*

    build-macos:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install deps
              run: |
                  pip install nuitka PySide6

            - name: Build macOS binary
              run: |
                  chmod +x build.sh
                  VERSION=${GITHUB_REF_NAME} ./build.sh

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macos-build
                  path: dist/*

    release:
        needs: [build-linux, build-windows, build-macos]
        runs-on: ubuntu-latest

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/**/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}