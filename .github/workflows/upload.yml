release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
        - name: Download all artifacts
          uses: actions/download-artifact@v4
          with:
              path: dist

        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
              files: dist/**/*
          env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
